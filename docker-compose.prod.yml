services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/.data
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - backend-data:/app/.data
    depends_on:
      - redis
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  redis-data:
